name: Build debug APK

on:
  push:
    branches:
      - claude/android-task-reward-app-ff86pp
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoard-debug-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish/update downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Latest debug build
          body: >
            Automatically rebuilt from commit ${{ github.sha }}.
            Download the APK below, open it on your phone, and allow
            "install unknown apps" for your browser/files app if prompted.
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
